listener 8883
allow_anonymous false
password_file /run/smartcare/passwords
acl_file /run/smartcare/acl
certfile /run/smartcare/broker.crt
keyfile /run/smartcare/broker.key
tls_version tlsv1.2
require_certificate false
persistence false
log_dest stdout
log_type error
log_type warning
connection_messages false
max_packet_size 131072
